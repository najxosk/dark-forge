<body tabindex="-1">
<div id="app" tabindex="0" style="outline:none">
<canvas id="embers"></canvas>

<!-- MENU -->
<div class="screen on" id="menu">
 <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
  <h1>DARK FORGE<small>BLOOD &amp; IRON</small></h1>
  <canvas id="logoCv" width="300" height="160" style="width:70%;margin:10px auto;display:block"></canvas>
  <div class="hud" id="menuHud" style="justify-content:center"></div>
  <button class="btn gold" id="bPlay" data-t="m_play"></button>
  <button class="btn" id="bShop" data-t="m_shop"></button>
  <button class="btn" id="bTroph" data-t="m_troph"></button>
  <button class="btn" id="bGuide" data-t="m_guide"></button>
  <button class="btn" id="bSet" data-t="m_set"></button>
  <div class="langrow" id="menuLang"></div>
 </div>
 <div class="muted pconly" style="text-align:center" data-t="m_keys"></div>
</div>

<!-- ORDERS -->
<div class="screen" id="orders">
 <div class="hud" id="ordHud"></div>
 <h2 data-t="o_title"></h2><div class="muted pconly" style="text-align:center" data-t="o_keys"></div>
 <div class="hud" id="repBar" style="justify-content:center;flex-wrap:wrap;font-size:13px"></div>
 <div class="scroll" id="ordList"></div>
 <button class="btn small" id="bRefresh" style="align-self:center;width:auto"></button>
 <div class="panel"><div style="font-weight:bold;color:#ffbf70" data-t="o_chal"></div><div id="chalList"></div></div>
 <button class="btn" id="bOrdBack" data-t="back"></button>
</div>

<!-- FORGE -->
<div class="screen" id="forge">
 <canvas id="cv"></canvas>
 <div id="fhead">
  <div class="hud"><button class="btn small" id="pauseBtn">❚❚</button><span id="fPhase"></span><span id="fCombo">Combo x1</span><span id="fHits"></span><button class="btn small" id="scrollIco" aria-label="scroll">📜</button><button class="btn small mobonly" id="fGuideBtn">❓</button></div>
  <div id="fcard"></div>
 </div>
 <div id="tut"></div>
 <div id="mechInd" data-t="mech_ind"></div>
 <div id="mechBtn" class="mobonly"><canvas id="belCv" width="300" height="190"></canvas><b data-t="mech_btn"></b></div>
 <div id="tapHint" class="mobonly"></div>
 <div id="focusOv" data-t="focus"></div>
 <div id="scrollOv"><div id="scrollP"><div class="rod"></div><div class="parch"><div class="sc-title" id="scTitle"></div><div class="sc-cust" id="scCust"></div>
  <canvas id="scWep" width="420" height="150"></canvas><div class="sc-name" id="scName"></div>
  <div class="sc-icons"><div class="sc-box" id="scGemBox"><div class="sc-big" id="scGem"></div><small id="scGemL"></small></div><div class="sc-box"><div class="sc-big sc-stars" id="scStars"></div><small id="scMinL"></small></div><div class="sc-box"><div class="sc-big" id="scCoins"></div><small id="scRewL"></small></div></div>
  <div class="sc-story" id="scStory"></div><div class="sc-tap" id="scTap"></div></div><div class="rod"></div></div></div>
</div>

<!-- RESULT -->
<div class="screen" id="result">
 <div id="resCoins" class="hudcoin">🪙 0</div>
 <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
  <h2 id="resTitle" data-t="r_title"></h2>
  <canvas id="resCv" width="600" height="240" style="height:min(26vh,240px);max-width:90%;margin:0 auto;display:block;object-fit:contain"></canvas>
  <div class="big" id="resQ"></div>
  <div class="panel" id="resBox"></div>
  <button class="btn gold" id="bNext" data-t="r_next"></button>
  <button class="btn gold" id="bTest" data-t="r_test"></button>
  <div class="row"><button class="btn grow" id="bResShop" data-t="m_shop"></button><button class="btn grow" id="bResMenu" data-t="r_menu"></button></div>
 </div>
</div>

<!-- ENDING -->
<div class="screen" id="ending">
 <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
  <h1 class="divineh" data-t="e_title"></h1>
  <canvas id="endCv" width="700" height="300" style="width:min(90%,700px);margin:0 auto;display:block"></canvas>
  <div class="panel" style="text-align:center;font-size:18px" data-t="e_text"></div>
  <div class="panel" id="endStats"></div>
  <button class="btn gold" id="bEndCont" data-t="e_cont"></button>
 </div>
</div>

<!-- BAMBOO -->
<div class="screen" id="bamboo" style="padding:0">
 <canvas id="bcv" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair"></canvas>
 <div class="hud" style="position:absolute;top:calc(env(safe-area-inset-top) + 44px);left:0;right:0;justify-content:center;pointer-events:none"><span id="bHud"></span></div>
 <button class="btn small" id="bBSkip" style="position:absolute;right:12px;bottom:12px"></button>
</div>

<!-- SHOP -->
<div class="screen" id="shop">
 <div class="hud" id="shopHud"></div>
 <h2 data-t="s_title"></h2>
 <div class="scroll" id="shopList"></div>
 <button class="btn gold" id="bShopPlay" data-t="s_play"></button>
 <button class="btn" id="bShopBack" data-t="s_back"></button>
</div>

<!-- TROPHIES -->
<div class="screen" id="troph">
 <h2 data-t="t_title"></h2>
 <div class="scroll"><div class="trophies" id="tropList"></div><div class="panel" id="statBox" style="margin-top:12px"></div></div>
 <button class="btn" id="bTropBack" data-t="back"></button>
</div>

<!-- SETTINGS -->
<div class="screen" id="settings">
 <h2 data-t="set_title"></h2>
 <div class="panel"><div class="muted" data-t="set_lang"></div><div class="langrow" id="setLang"></div></div>
 <div class="panel">
  <button class="btn" id="bSound"></button>
  <button class="btn" id="bVib"></button>
  <button class="btn" id="bTutAgain" data-t="set_tut"></button>
 </div>
 <div class="panel"><div class="muted" data-t="set_resetInfo"></div>
  <button class="btn" id="bReset" style="border-color:#c03020;background:linear-gradient(#601810,#2a0805)" data-t="set_reset"></button></div>
 <div style="flex:1"></div>
 <button class="btn" id="bSetBack" data-t="back"></button>
</div>

<div class="overlay" id="pauseOv">
 <h2 data-t="p_title"></h2>
 <button class="btn gold" id="bResume" data-t="p_resume"></button>
 <button class="btn" id="bPGuide" data-t="p_guide"></button>
 <div class="muted pconly" style="text-align:center" data-t="p_keys"></div><button class="btn" id="bQuit" data-t="p_quit"></button>
</div>
<div class="overlay" id="guideOv" style="z-index:12;overflow:auto">
 <div style="width:min(100%,760px);margin:auto">
 <h2 data-t="g_title"></h2>
 <canvas id="guideCv" width="720" height="300" style="width:100%;display:block"></canvas>
 <div class="panel" style="font-size:18px;line-height:1.5" data-t="g_body"></div>
 <button class="btn gold" id="bGuideOk" data-t="g_ok"></button>
 <div class="muted pconly" style="text-align:center" data-t="g_hint"></div>
 </div>
</div>
<div class="overlay" id="confirmOv">
 <h2 id="confTxt" data-t="c_q"></h2>
 <button class="btn" id="bConfYes" style="border-color:#c03020" data-t="c_yes"></button>
 <button class="btn gold" id="bConfNo" data-t="c_no"></button>
</div>
<div id="toast"></div>
<div id="rotOv"><div style="font-size:64px">📱↻</div><span data-t="rot"></span></div>
</div>

function refillChal() {
  S.chal = S.chal || [];
  while (S.chal.length < 3) {
    const pool = CHAL_POOL.filter(c => !S.chal.some(x => x.t === c.t));

let AC = null, master = null, bellowsGain = null, bellowsSrc = null, hum = null, humGain = null;
function audioInit() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.6; master.connect(AC.destination);
    const buf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    noiseBuf = buf;
    bellowsSrc = AC.createBufferSource(); bellowsSrc.buffer = buf; bellowsSrc.loop = true;
    const f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 500; f.Q.value = 0.7;
    bellowsGain = AC.createGain(); bellowsGain.gain.value = 0;
    bellowsSrc.connect(f); f.connect(bellowsGain); bellowsGain.connect(master); bellowsSrc.start();
    hum = AC.createOscillator(); hum.type = "triangle"; hum.frequency.value = 80;
    humGain = AC.createGain(); humGain.gain.value = 0; hum.connect(humGain); humGain.connect(master); hum.start();
  } catch (e) { AC = null; }
}
let noiseBuf = null;
function tone(freq, dur, type = "sine", vol = 0.3, delay = 0, slide = 0) {
  if (!AC || !S.sound) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 2000, type = "highpass", delay = 0) {
  if (!AC || !S.sound || !noiseBuf) return;
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.02);
}

    BT.stuck = { y, slope, dir }; BT.shake = 14;
    for (let i = 0; i < 14; i++) BT.parts.push({ x: POLE.x, y, vx: (Math.random() - .5) * 300, vy: -Math.random() * 300, l: 0.5, leaf: false, c: "#ffb040" });
    BT.msg = { t: TR("bm_stuck"), sub: msg, col: "#ff6a50", l: 1.6 };
    SFX.thunk(); vib(80);
  }
}
function updateBamboo(dt) {
  if (BT.slow > 0) { BT.slow -= dt; dt *= CONFIG.bamboo.slowFactor; }
  BT.timer += dt; BT.t += dt;
  if (BT.state === "wait" && BT.t > 0.5) { BT.state = "ready"; BT.t = 0; }
  if (BT.state === "after" && BT.t > 1.5) {
    BT.i++; BT.t = 0; BT.stuck = null; BT.pieces = [];
    if (BT.i >= BT.poles.length) { BT.state = "end"; setTimeout(endBamboo, 300); } else BT.state = "wait";
  }
  if (BT.timer > CONFIG.bamboo.maxTime && BT.state !== "end") { BT.state = "end"; endBamboo(); return; }
  BT.pieces.forEach(p => { p.vy += 900 * dt; p.dx += p.vx * dt; p.dy += p.vy * dt; p.rot += p.vr * dt; });
  BT.parts.forEach(p => { p.vy += 700 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.l -= dt; });
  BT.parts = BT.parts.filter(p => p.l > 0);
  BT.shake *= Math.pow(0.003, dt); if (BT.msg) { BT.msg.l -= dt; if (BT.msg.l <= 0) BT.msg = null; }
  const now = performance.now(); BT.trail = BT.trail.filter(q => now - q.t < 160);
}
function drawPoleSeg(x, w, y0, y1, col) {
  x.fillStyle = col; x.fillRect(-w / 2, y0, w, y1 - y0);
  const g = x.createLinearGradient(-w / 2, 0, w / 2, 0); g.addColorStop(0, "rgba(0,0,0,.35)"); g.addColorStop(0.35, "rgba(255,255,255,.25)"); g.addColorStop(1, "rgba(0,0,0,.45)");
  x.fillStyle = g; x.fillRect(-w / 2, y0, w, y1 - y0);
  x.fillStyle = "rgba(0,0,0,.35)"; for (let yy = POLE.top + 90; yy < POLE.bot; yy += 110) if (yy > y0 && yy < y1) x.fillRect(-w / 2 - 2, yy, w + 4, 6);
}
function drawBamboo() {
  const x = bctx; x.setTransform(DPR, 0, 0, DPR, 0, 0); x.clearRect(0, 0, RW, RH);
  x.fillStyle = "#0c0705"; x.fillRect(0, 0, RW, RH);
  x.setTransform(DPR * BSC, 0, 0, DPR * BSC, DPR * BOX, DPR * BOY); x.save();
  if (BT.shake > 0.3) x.translate((Math.random() - .5) * BT.shake, (Math.random() - .5) * BT.shake);
  drawEnv(x, RES.o.phase, 1280, 720); x.fillStyle = "rgba(0,0,0,.55)"; x.fillRect(0, 0, 1280, 720);
  if (BT.slow > 0) { x.fillStyle = `rgba(255,230,150,${BT.slow * 0.15})`; x.fillRect(0, 0, 1280, 720); }
  x.fillStyle = "#1a0d06"; x.fillRect(0, POLE.bot, 1280, 80); x.fillStyle = "#3a2010"; x.fillRect(POLE.x - 90, POLE.bot - 10, 180, 22);
  const pole = bPole();
  if (pole && BT.state !== "end") {
    const w = poleW(pole[1]);
    x.save(); x.translate(POLE.x, 0);
    if (BT.pieces.length) {
      const pc = BT.pieces[0];
      // spodok (zostáva)
      x.save(); x.beginPath(); x.moveTo(-w, pc.y + pc.slope * -w); x.lineTo(w, pc.y + pc.slope * w); x.lineTo(w, POLE.bot); x.lineTo(-w, POLE.bot); x.closePath(); x.clip();
      drawPoleSeg(x, w, POLE.top, POLE.bot, pole[2]); x.restore();
      // vrch (padá)
      x.save(); x.translate(pc.dx, pc.dy); x.translate(0, pc.y); x.rotate(pc.rot); x.translate(0, -pc.y);
      x.beginPath(); x.moveTo(-w, POLE.top - 10); x.lineTo(w, POLE.top - 10); x.lineTo(w, pc.y + pc.slope * w); x.lineTo(-w, pc.y + pc.slope * -w); x.closePath(); x.clip();
      drawPoleSeg(x, w, POLE.top, POLE.bot, pole[2]); x.restore();
      x.fillStyle = "#f4f0c8"; x.beginPath(); x.ellipse(0, pc.y, w / 2, 5, Math.atan(pc.slope), 0, 7); x.fill();
    } else drawPoleSeg(x, w, POLE.top, POLE.bot, pole[2]);
    x.restore();
    if (BT.stuck) { // zaseknutá čepeľ
      x.save(); x.translate(POLE.x, BT.stuck.y); x.rotate(Math.atan(BT.stuck.slope) + (BT.stuck.dir < 0 ? Math.PI : 0));
      drawWeapon(x, RES.o.shape, -170, 0, 300, 50, RES.q, null, itemPhase(RES.o.item), RES.o.item); x.restore();
      x.strokeStyle = "#000"; x.lineWidth = 3; x.beginPath(); x.moveTo(POLE.x - 4, BT.stuck.y - 12); x.lineTo(POLE.x + 6, BT.stuck.y + 14); x.stroke();
    }
    // štítok
    if (MOB) { x.save(); x.translate(-432, 360); x.scale(1.0, 1.0); } x.fillStyle = "rgba(15,6,3,.9)"; x.strokeStyle = "#6a3416"; x.lineWidth = 2; x.fillRect(820, 200, 380, 150); x.strokeRect(820, 200, 380, 150);
    x.textAlign = "left"; x.fillStyle = "#ffd6a0"; x.font = "bold 24px Georgia"; x.fillText(TR("bm_pole", { i: BT.i + 1, n: BT.poles.length, name: pole[0] }), 836, 236);
    x.font = "bold 22px Georgia"; x.fillStyle = "#ff9a70"; x.fillText(TR("bm_hard", { h: pole[1] }), 836, 276);
    x.fillStyle = BT.dmg * CONFIG.bamboo.speedMax >= pole[1] ? "#7dff8c" : "#ff6a50";
    x.fillText(TR("bm_yours", { d: BT.dmg }), 836, 312);
    x.font = "16px Georgia"; x.fillStyle = "#b88d6c"; x.fillText(BT.dmg * CONFIG.bamboo.speedMax >= pole[1] ? TR("bm_swing") : TR("bm_weak"), 836, 338); if (MOB) x.restore();
  }
  // výsledky
  BT.results.forEach((r, i) => { x.fillStyle = r.ok ? "#7dff8c" : "#ff6a50"; x.font = MOB ? "bold 17px Georgia" : "bold 22px Georgia"; x.textAlign = "left"; x.fillText(`${i + 1}. ${r.ok ? TR("bm_cut") : TR("bm_stuckL")} (${r.power} / ${r.h})`, MOB ? 385 : 70, (MOB ? 190 : 230) + i * (MOB ? 26 : 34)); });
  // častice
  BT.parts.forEach(p => { x.globalAlpha = Math.min(1, p.l * 2); x.fillStyle = p.leaf ? "#6fcf4a" : p.c; if (p.leaf) { x.beginPath(); x.ellipse(p.x, p.y, 7, 3, p.x / 30, 0, 7); x.fill(); } else x.fillRect(p.x, p.y, 4, 4); });
  x.globalAlpha = 1;
  // stopa švihu
  const tr = BT.trail; if (tr.length > 1) { x.lineCap = "round"; for (let i = 1; i < tr.length; i++) { x.strokeStyle = `rgba(255,240,200,${i / tr.length})`; x.lineWidth = 2 + i * 0.9; x.beginPath(); x.moveTo(tr[i - 1].p[0], tr[i - 1].p[1]); x.lineTo(tr[i].p[0], tr[i].p[1]); x.stroke(); } }
  if (BT.msg) { const m = BT.msg; x.globalAlpha = Math.min(1, m.l * 2); x.textAlign = "center"; x.font = MOB ? "bold 44px Georgia" : "bold 56px Georgia"; x.lineWidth = 6; x.strokeStyle = "#200800"; x.strokeText(m.t, 640, 110); x.fillStyle = m.col; x.fillText(m.t, 640, 110);
    x.font = "bold 22px Georgia"; x.fillStyle = "#ffe6c0"; x.fillText(m.sub, 640, 120 + 40); x.globalAlpha = 1; }
  x.textAlign = "center"; x.font = "18px Georgia"; x.fillStyle = "#b88d6c";
  x.fillText(MTk("bm_hint", { s: Math.max(0, Math.ceil(CONFIG.bamboo.maxTime - BT.timer)) }), 640, MOB ? 548 : 30);
  x.restore();
}

const embers = [];
function drawEmbers(dt) {
  const c = $("embers"), x = c.getContext("2d");
  x.clearRect(0, 0, c.width, c.height);
  if (cur === "forge") return;
  if (embers.length < 45) embers.push({ x: Math.random() * c.width, y: c.height + 10, vy: 20 + Math.random() * 50, vx: (Math.random() - .5) * 20, s: 1 + Math.random() * 2.5, l: 1 });

}
