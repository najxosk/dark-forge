function applyData() {
  const d = DD();
  d.QN.forEach((q, i) => QN[i] = q);
  for (const n in d.PH) { PH[n].name = d.PH[n][0]; PH[n].env = d.PH[n][1]; }
  for (const k in ITEMS) ITEMS[k].forEach(it => it.name = d.items[it.id]);
  for (const k in CONFIG.shop) { CONFIG.shop[k].name = d.shop[k][0]; CONFIG.shop[k].desc = d.shop[k][1]; }
  for (const k in CONFIG.gems.types) { const g = CONFIG.gems.types[k]; [g.name, g.ins, g.desc] = d.gems[k]; }
  for (const k in CONFIG.traits) { CONFIG.traits[k].name = d.traits[k][0]; CONFIG.traits[k].desc = d.traits[k][1]; }
  CONFIG.events.forEach((e, i) => { e.name = d.events[i][0]; e.desc = d.events[i][1]; });
  for (const f in CONFIG.factions) CONFIG.factions[f] = d.factions[f];
  for (const ph in CONFIG.chains) { const ch = CONFIG.chains[ph]; ch.name = d.chains[ph][0]; ch.steps.forEach((st, i) => { st.cust = d.chains[ph][1][i][0]; st.story = d.chains[ph][1][i][1]; }); }
}
function itemName(id) { return DD().items[id] || id; }
function withGem(id, k) { return DD().withGem.replace("{item}", itemName(id)).replace("{ins}", DD().gems[k][1]); }
function locOrder(o) {   // recompute all displayed texts of an order from its keys
  const d = DD(), k = o.ck || {};
  if (o.king) { o.cust = d.king[0]; o.ev = d.king[1]; }
  else if (o.chain) o.cust = d.chains[o.chain.ph][1][o.chain.step][0];
  else if (k.t === "e") { o.cust = d.events[k.i][0]; o.ev = d.events[k.i][1]; }
  else if (k.t === "r") o.cust = d.rare[k.i];
  else if (k.t === "c") o.cust = d.cust[k.ph][k.i];
  o.name = o.gemReq ? withGem(o.item, o.gemReq) : itemName(o.item); o.baseName = itemName(o.item);
  if (o.gemReq) o.story = o.chain ? d.chains[o.chain.ph][1][o.chain.step][1] : d.stories[o.gemReq][o.si || 0];
  return o;
}
function chalTxt(c) { return DD().chal[c.t] || ""; }
function setLang(l, user) {
  if (l !== "sk" && l !== "en") return; LANG = l; if (user) { try { localStorage.setItem("darkforge_lang", l); } catch (e) { } }

}
function langButtons() { return ["sk", "en"].map(l => `<button class="btn small langb ${LANG === l ? "gold" : ""}" data-lang="${l}">${l === "sk" ? "🇸🇰 SK" : "🇬🇧 EN"}</button>`).join(""); }
function applyLang() {
  document.documentElement.lang = LANG; applyData();

  const ic = document.getElementById("scrollIco"); if (ic) ic.title = TR("sc_ico");
  ["menuLang", "setLang"].forEach(id => { const e = document.getElementById(id); if (!e) return; e.innerHTML = langButtons();

    ordersInPhase: { 1: 0, 2: 0 }, trophies: {}, stats: { orders: 0, leg: 0, burned: 0, perfects: 0, bestCombo: 0, earned: 0 },
    chal: [], orders: [] };
}
let S = freshSave(); S.rep = { 1: 0, 2: 0, 3: 0, 4: 0 }; S.gems = { rubin: 0, zafir: 0, smaragd: 0 }; S.buffs = {};
function load() {
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY)); if (d) S = Object.assign(freshSave(), d); } catch (e) { }
  S.ordersInPhase = Object.assign({ 1: 0, 2: 0, 3: 0, 4: 0 }, S.ordersInPhase);
  S.rep = Object.assign({ 1: 0, 2: 0, 3: 0, 4: 0 }, S.rep || {});
  S.gems = Object.assign({ rubin: 0, zafir: 0, smaragd: 0 }, S.gems || {});
  S.buffs = S.buffs || {}; S.stats = Object.assign({ divine: 0 }, S.stats);
  S.gemStock = Object.assign({ rubin: CONFIG.gems.stockStart, zafir: CONFIG.gems.stockStart, smaragd: CONFIG.gems.stockStart }, S.gemStock || {});
  S.chain = Object.assign({ 3: 0, 4: 0 }, S.chain || {}); S.gemTroph = S.gemTroph || {}; S.restock = S.restock || 0;
  if (S.phase > maxPhase()) S.phase = maxPhase();
  if (!S.chal || S.chal.length < 3) refillChal();
